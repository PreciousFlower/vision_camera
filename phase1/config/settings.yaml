# 运行参数与后端配置
# 敏感信息（API Key）不要写在这里，用环境变量：SKYWORK_API_KEY / DASHSCOPE_API_KEY

# ── 当前使用的后端：mock | cloud | cluster ──
# mock    : 本地假模型，零成本零网络，用于跑通链路和自检（默认）
# cloud   : 云端 API（OpenAI 兼容），第一阶段主力，快速迭代 Prompt
# cluster : 同济 A800 本地模型（离线，免费）
backend: mock

paths:
  data_dir: data
  frames_dir: data/frames
  # 启动时保留最近几个任务的帧目录（持续监测一小时能产几千张图，攒着会把盘写满）。
  # 0 = 不清理。清理只在服务启动时做，不影响正在跑的任务。
  frames_keep_jobs: 20
  results_dir: runs
  behaviors: config/behaviors.yaml

# ── 抽帧参数 ──
extract:
  # 长边缩放到多少像素。640 是实测的性价比点：
  # 人在画面中占比足够辨认动作，单帧体积从 ~1.5MB 降到 ~80KB，
  # 上传集群的时间和云端 token 成本都大幅下降。
  max_side: 640
  jpeg_quality: 82
  # 每秒钟抽几帧。窗口内部靠这几帧体现"动作"，所以要覆盖住动作时长。
  fps: 1.0
  # 单个窗口最多几帧（超过则按 fps 等间隔取）
  max_frames_per_window: 4

# ── mock 后端（零成本自检用）──
mock:
  # 均匀噪声比例：每次判断以该概率翻转结果。
  #   0.0（默认）= 干净模型。自检时指标应接近 100%，说明管道与聚合逻辑正确。
  #   >0        = **压力测试**，专门观察时序平滑能否把噪声压下去。
  #              此时指标低是预期行为，不代表代码有问题。
  #
  # ⚠️ 曾经默认 0.2，结果端到端精确率只有 18%，看起来像模型很差，
  #    实际是 mock 在乱答 —— 一个"故意答错"的假模型对自检没有价值。
  noise: 0.0
  seed: 7

# ── 云端后端（OpenAI 兼容）──
cloud:
  # 任何 OpenAI 兼容端点都能用：DashScope / 硅基流动 / vLLM / OpenRouter
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3-vl-plus"
  api_key_env: "DASHSCOPE_API_KEY"
  timeout_sec: 120
  max_retries: 3
  # 限速：并发太高会被 429。第一轮建议 2，跑通后再调
  concurrency: 2
  # 是否把窗口内的多帧拼成一张 2×2 网格图再送模型
  #   false（默认）：多帧各自作为一张图，细节保留最好
  #   true         ：拼成一张，请求体积和 token 都明显更低，
  #                  但每格分辨率减半，适合"看整体动作"而非"看手中小物体"
  # 端点报"不支持多图"时也必须改成 true。
  stitch_frames: false
  # 单价（元 / 百万 token），用于成本估算。以控制台实际账单为准。
  price_in_per_mtok: 0.0
  price_out_per_mtok: 0.0

# ── 集群后端（同济 A800，纯 transformers，无 vLLM）──
cluster:
  # 本地 PC 侧的仓库工具目录（含 cluster.py，paramiko 封装）
  tools_dir: "E:\\vibecoding\\aipc\\tools"
  # 集群上的工作目录
  remote_workdir: "/share/home/u00009/apps/civility-kit"
  # 集群 Python（绝对路径，因为 conda activate 不可用）
  remote_python: "/share/home/u00009/apps/conda/envs/vlm/bin/python"
  # HF 缓存（离线加载已下好的权重）
  remote_model_root: "/ssdfs/datahome/u00009/models"
  # 已实测在集群上的模型
  remote_model: "Qwen/Qwen3-VL-4B-Instruct"
  # 必须排除驱动过旧的节点：这些节点驱动是 550.54.14，而 torch 是 cu130 编译
  # （需 ≥580），在上面 torch.cuda.is_available() 返回 False。
  #
  # ⚠️ 这份列表来自 2026-10-05 对全部 19 个 A800 节点的逐个实测
  #    （tools/scan_all_nodes.sh，耗时 15 分钟）：
  #        580.65.06 ✅  gpu8001 8004 8006 8009 8010 8013 8020
  #        550.54.14 ❌  gpu8007 8011 8012 8015
  #        未能探到      gpu8002 8003 8005（当时被 alloc / mix 占满）
  #    旧文档只列了 gpu8002/8003/8012 —— 漏了 8007/8011/8015。
  #    硬编码一份过期的列表会导致作业随机失败，且症状隐蔽
  #    （作业能起来，只是 CUDA 不可用）。所以脚本里另有运行时预检兜底。
  exclude_nodes: "gpu8002,gpu8003,gpu8005,gpu8007,gpu8011,gpu8012,gpu8015"
  partition: "A800"
  cpus_per_task: 4
  mem: "64g"
  time_limit: "0-03:00:00"
  # 常驻推理服务的端口（网页经隧道访问它）
  service_port: 18080

# ── 告警判定策略 ──
aggregate:
  # 用哪种方式决定"要不要告警"。三选一：
  #
  #   immediate —— AI 判定命中就立刻告警（首个命中窗口即报）
  #                延迟最低、召回最高；代价是模型单帧抖动会直接变成误报。
  #
  #   ai        —— **让模型自己判断该不该告警**，并在输出里给出理由
  #                （Prompt 会额外要求 alert / alert_reason 两个字段）。
  #                模型能看完整窗口的动作链条再决定，比只看 violation 稳；
  #                代价是输出变长、延迟略增。
  #
  #   smoothed  —— 时序平滑：连续 N 个窗口内命中 M 次才告警
  #                误报最少，但明显的行为也要等第二个窗口（4-8 秒）才报。
  #
  # 怎么选：先用 ai 或 immediate 跑真实视频，看误报能不能接受；
  # 误报太多再换 smoothed 收紧。改完**不用重启推理服务**，本机即时生效。
  mode: ai

  # 模型给的置信度低于此值直接丢弃（三种模式都生效）
  min_confidence: 0.45

  # ── 仅 mode: smoothed 使用 ──
  # 同类型行为在连续 N 个窗口内出现 M 次即告警（M/N 规则比纯连续更鲁棒）
  window_k: 4
  min_hits: 2

  # ── 三种模式共用 ──
  # 去抖：同一类型告警在这个秒数内只报一次（避免同一件事说三遍）
  dedup_sec: 30

# ── 成本守卫：不让人"忘了关"就一直在计费 ──
# 背景（真实账单）：14 天里有一个 civility-serve 作业跑满 12 小时被 TIMEOUT，
#   单它约 12 GPU·小时 ≈ 48 元，占那段时间全部花费的 85%。
#   原因是网页重启后作业号丢失，集群上的作业成了没人管的"孤儿"，
#   一路跑到 sbatch 的 12 小时上限。
service:
  # 空闲多久自动释放节点（分钟）。判据是"页面上报可见心跳"的间隔：
  #   · 关掉浏览器 / 关掉标签页 → 没有心跳
  #   · 标签页切到后台 → 心跳里 visible=false
  # 两种情况超过这个分钟数（且当前没有正在跑的分析任务）就把 A800 退掉。
  # 设 0 = 关闭自动释放（不建议）。
  idle_release_min: 15

  # 服务连续运行的最长小时数（自设上限，比平台的 12 小时严格得多）。
  # 达到上限就自动释放；但如果**此刻正在分析画面**，不打断，
  # 改成每 30 分钟延长一次并记日志。设 0 = 不限制。
  max_run_hours: 3

  # 计费单价（元/卡时），只用于页面上估算"已经花了多少"，以平台账单为准。
  gpu_price_per_hour: 4.0

  # 启动时自动检查集群上有没有孤儿作业（本项目名下、但不归当前网页管）。
  # 只提示 + 提供一键停止，不自动杀 —— 避免误杀你从别处提交的作业。
  check_orphans_on_start: true

# ── 实时流（本地摄像头 / RTSP）──
live:
  # ⚠️ 窗口步长决定"多久采一批画面"。它的下限历史上是被推理耗时逼出来的：
  #    老架构"一个窗口一次往返"，步长 < 推理耗时（8~10 秒）就会越积越旧，
  #    所以那时候只能设 12 秒。
  # ★ 现在有了批量流水线（continuous_batch_windows=8 + infer_workers=8 +
  #    pipeline=true），步长可以压到 1~2 秒而**不滞后**：
  #    8 个窗口一批、一批约 11.5 秒出结果 → 均摊 1.4 秒/条结论。
  #    ⚠️ 但只在 pipeline=true 且服务端支持批量时才成立 ——
  #       若把 pipeline 关掉或退回单请求模式，请把步长调回 ≥ 10 秒，
  #       否则画面会越来越旧（页面会亮"跟不上"提示）。
  window_stride_sec: 2.0
  # 一次检测采集多少个窗口就停（避免无限占用推理服务）
  # 10 个窗口 × 6 秒 ≈ 1 分钟
  max_windows: 10
  # ── 持续监测（监测页的"开始监测"）──
  # 一批采几个窗口就送去推理，采完立刻回到采集。
  # ⚠️ 必须是**小数字**：批次就是"采集↔推理"的交替粒度。
  #    踩过的坑：原本这里沿用 max_windows=100000，
  #    而采集函数的退出条件是"采满上限"——于是第一批永远不返回，
  #    现象是"页面上窗口数一直在涨，但一条结果、一条告警都没有"。
  #
  # ★★ 这个数就是**实时性的主旋钮**（2026-10-09 实测改小）：
  #     滞后 ≈ 批内窗口数 × 窗口步长
  #     用户反馈"点开始检测后 15 秒才出第一个结果，之后动作与检出也始终差
  #     15 秒"。查日志发现每轮 16 秒里**推理只占 7 秒**，另外 9 秒纯粹是在等
  #     采集把 8 个窗口凑齐 —— 也就是说推理本来就有余力，攒批是唯一的滞后来源：
  #         8 窗 × 2 秒步长 = 16 秒滞后  ← 旧默认
  #         2 窗 × 2 秒步长 =  4 秒滞后  ← 现在
  #     而且**成本几乎不变**：整批耗时从 16s 降到约 4s，但每窗均摊 GPU 秒
  #     只从 0.875s 变成约 0.9s（推理仍是那块卡在算，只是算得少一点）。
  #
  # ⚠️ 为什么以前是 8：那时按"服务端批量上限 VLM_BATCH_MAX=8"来配，
  #    目标是**吞吐**（批量 8 的吞吐是单条的 4 倍，见 cluster/vlm_bench.py）。
  #    但吞吐最大化 ≠ 体验最好：攒满 8 个要花 16 秒，用户看到的就是"慢半拍"。
  #    8 不是错，只是它优化的是另一个目标。
  # ⚠️ 上限 16（服务端批量上限的 2 倍）：再多也不会更快，只会让攒批时间翻倍。
  #    调大它 = 更省卡时但更滞后；调小它 = 更实时但每窗更贵。页面可临时调。
  continuous_batch_windows: 2

  # ── 动作量门控：画面基本没动就**不调模型** ──
  # 实测每个窗口推理 10~12 秒，而空走廊/无人经过的窗口往往占大多数 ——
  # 那些窗口送模型纯属浪费（既费卡时，也让人白等十几秒）。
  # 判据：把窗口内的帧缩成 48×48 灰度，算相邻帧平均差的最大值。
  # ⚠️ 阈值调**高**会漏报（把有动作的窗口当成静止），调低则省不下多少。
  #    日志会把每次测到的动作量打出来（含"接近阈值，仍送模型"的提示），照它调。
  # ⚠️ 两道保险：只在持续监测里生效；且上一窗刚命中违规时不生效
  #    （刚报过违规说明场面正有事，这时省一次调用可能漏掉后续动作）。
  #
  # ★★ 这个分数**取决于取样间隔**，改步长后必须重新标定（实测踩到）：
  #    同一段"有人走动"的素材，帧间隔越大分数越高、间隔越小分数越低：
  #        步长 6 秒（帧间隔 2.00 秒）：移动 4.6~5.1   静止 0.00~0.13
  #        步长 1 秒（帧间隔 0.33 秒）：移动 1.4~1.5   静止 0.04
  #    第一版阈值写 1.5，是按 6 秒步长标定的；换成流水线默认的短步长后，
  #    真实动作的分数掉到 1.4 —— **正好被误判成静止、造成漏报**。
  #    回归测试（tools/test_motion_gate.py）抓到了这一点，所以阈值下调到 0.5：
  #    它在两种间隔下都能把"真静止"（≤0.13）与"有动作"（≥1.4）分开。
  #    代价是只有明显动作才省调用 —— 漏报的代价远高于多花一点卡时。
  motion_gate: true
  motion_threshold: 0.5

  # ── 并发与流水线（见 WEBUI-可视化界面.md §3.3.4）──
  # 本地同时发出的推理请求数。服务端靠"几乎同时到达"来凑批，所以并发度
  # 影响"能凑出多大的批"。线程只是在等 HTTP 响应，很便宜，可以给宽一点。
  # ★ 2026-10-09 起默认值从 8 降到 4：一批只攒 2 个窗口（见上），
  #   本地同时最多也就 2 个请求在飞，给 8 个线程是浪费。
  #   真正的批量发生在**服务端**：上一轮还在算时下一轮的请求会排在队列里，
  #   服务端自然把它们凑成更大的批 —— 不需要本地配合。
  infer_workers: 4
  # 采集与推理流水线：推理这一批时，后台线程已在采下一批。
  # 关掉就退回"采集→推理→采集"的串行节奏（每批耗时变成两者相加）。
  # ★ 攒批调小后这个开关更关键了：一批只有 2 个窗口（4 秒），
  #   若采集与推理串行，一轮就变成 4+2.2=6.2 秒，滞后直接多一半。
  pipeline: true
