# 不文明行为定义 —— 第一阶段的核心可配置项
#
# 设计原则（很重要，直接决定识别率）：
#   1. 只写「可视觉验证的感知线索」，不写「社会规范判断」。
#      反例：让模型判断"是否插队" → 模型要猜社会规则，必错。
#      正例：让模型找"有人从队列侧方切入到前方位置" → 纯视觉，可判。
#   2. 必须给反例（counter_examples）。VLM 最大的错法是"看到相似物体就报"，
#      反例是压制误报最有效的手段，比多加几条正例管用。
#   3. evidence_required 是防幻觉的关键：要求模型先描述"看到了什么"，
#      再下结论。先描述后判断，准确率显著高于直接问"有没有违规"。
#
# 改完这个文件不需要改任何代码，直接重跑即可。

version: 1
updated: "2026-10-10"

# 全局默认设置
defaults:
  # 一个判断窗口包含几帧（帧越多时序信息越强，但 token 成本线性上升）
  frames_per_window: 18
  # 窗口向前移动的间隔（秒），与6秒上下文重叠
  window_stride_sec: 2.0
  # 连续多少个窗口命中才升级为「告警」（时序平滑，压制单帧误报）
  alert_after_consecutive_windows: 2
  # 模型温度：判分/检测类任务必须贪心解码，否则同一帧两次结果不同，无法复现
  temperature: 0.0
  # 同时示范难负例与有明确证据的正例，避免模型只学会保守报false。
  few_shot: true
  # 基础输出上限；网页按启用行为、证据项、人物过程和开放风险增加预算。
  # 允许模型写完整事实，JSON写完即停，实际输出不必达到上限。
  max_new_tokens: 512
  # 证据不足的阳性回答由模型独立再看一次；仍不足则保留待复核。
  evidence_review: true

behaviors:

  - id: littering
    name: 乱扔垃圾
    enabled: true
    severity: medium
    definition: >
      画面中有人把手中的物品（纸屑、瓶子、包装袋、烟头等）主动丢弃到地面、
      座椅或其他非垃圾容器的位置；明确抛扔或松手丢下即构成丢弃，不要求等人物离开画面。
    evidence_required: >
      必须能看出"手中有物 → 物品脱手 → 物品落到地面/非容器处"这一动作链条。
      必须追踪同一人和同一物品，落点被遮挡即证据不足。离开是补充证据，不是必要前提。
      仅看到地上有垃圾、手里拿着垃圾袋、或物体暂时不在画面里，都不算。
    evidence_checks:
      held: 可辨认的人手中持有同一件物品
      released: 该物品确实已脱离手部，非遮挡或移出画面
      landed: 同一物品可见落在地面或非垃圾容器处，不能只由手变空推断
    evidence_sequence: [held, released, landed]
    counter_examples:
      - 把物品放入垃圾桶或垃圾袋（这是正确行为）
      - 弯腰捡起地上的物品
      - 手中物品只是被身体遮挡，并未脱手
      - 一直提着、举起或晃动垃圾袋，袋子仍在手里
      - 物品移到画面外或落点被挡住，无法确认是否落地
      - 暂时把袋子放在地上整理、打包或清理，尚未离开
      - 画面中只有垃圾、没有可辨认的人
    observable_cues:
      - 手部由持物状态变为空手
      - 物体轨迹指向地面或非容器表面
      - 人物丢弃后有离开该位置的位移

  - id: smoking
    name: 吸烟
    enabled: true
    severity: high
    definition: >
      画面中有人正在吸烟：手部把香烟/电子烟送到嘴边并有吸食动作，
      或指间夹持点燃的香烟且口鼻部有烟雾呼出。
    evidence_required: >
      必须看清香烟/电子烟本体，并看到点燃嘴边烟支、将烟具用于口部吸食、
      或持烟且明确呼出烟雾中的至少一种。正常持烟时手部分遮嘴不应自动判为证据不足；
      只有烟具不可辨认、关键过程全被遮住时才需要复核。没有烟雾也可由烟具和使用动作确认。
      只有直接看见烟雾产生并扩散时才能描述烟雾；看不见就不能补写。
    evidence_checks:
      tobacco: 清楚可辨的香烟或电子烟本体，已排除指甲剪、笔、餐具等相似物
      use: 同一人点燃嘴边可辨认烟支、将烟具用于口部吸食、或持烟并呼出可见烟雾，至少一种明确可见
    counter_examples:
      - 喝饮料、用吸管、吃东西（手也靠近口部）
      - 仅叼着尚未点燃的烟支、掏出打火机或准备点烟，尚未看到火焰点燃或实际吸食
      - 手持笔、筷子、细长工具等外形相似的物体
      - 手持指甲剪、钥匙或金属小工具靠近嘴巴
      - 仅手遮嘴、摸脸、挠鼻、咬指甲，没有可辨认烟具
      - 物体太小、模糊、反光，看不清是否为烟具
      - 环境中的水汽、蒸汽、哈气（非从口鼻呼出）
      - 画面角落的烟雾来源无法与人物口鼻关联
    observable_cues:
      - 指间夹持细长白色物体且端部有亮点
      - 口鼻部有向外扩散的缕状烟
      - 吸食动作（抬手至口部后停顿）

  - id: queue_jumping
    name: 插队
    enabled: true
    severity: medium
    definition: >
      画面中存在一条由多人组成的有序队列（多人沿近似一条线前后排列），
      其中有人从队列的侧方切入到某两个人的中间位置，破坏了原有的前后次序。
    evidence_required: >
      必须同时看到三件事：① 存在可辨认的队列；② 有人从侧方接近；
      ③ 切入后队列的前后次序发生改变。缺少任一项都不判定。
    counter_examples:
      - 单人站立、两人并排（未构成队列）
      - 人从队列旁边走过，未插入
      - 队伍本来就松散、正在自由移动（如散场人流）
      - 有人离开队列（离队不算插队）
    observable_cues:
      - 队列成员沿一条线前后排列且朝向一致
      - 新个体从队列侧向位置移动到两个已有成员之间
      - 插入后原成员位置被推移或停顿

  - id: no_safety_helmet
    name: 未佩戴安全帽
    enabled: true
    severity: high
    definition: >
      在可辨认的施工、建筑或其他需要安全帽的作业区域，人员头部清晰可见且未佩戴安全帽。
      头发或裸露头顶可见、未被帽体覆盖即符合；背面头部也能判断，不要求看到正脸。
      手里拿着、挂着或放在身旁的安全帽不算佩戴。即使只是在施工区行走，仍应判断防护状态。
    evidence_required: 必须同时看见需要防护的作业环境和人员未戴安全帽的头部，不能从看不清推断未佩戴。
    evidence_checks:
      worksite: 可辨认的施工或需要头部防护的作业环境
      bare_head: 涉事人员头发或裸露头顶可见，包括背面，头顶没有安全帽覆盖；手持安全帽仍是未佩戴
    counter_examples:
      - 公园、街道、室内日常生活等普通环境，不能要求行人戴安全帽
      - 头部被遮挡、出画或太小模糊，无法判断
      - 安全帽已经戴在头上

# ── 下面是"未启用"的扩展示例，展示如何只加配置、不加代码 ──
# 想启用就把 enabled 改成 true。id 必须唯一，全程用作告警类型标识。
  - id: spitting
    name: 随地吐痰
    enabled: false
    severity: high
    definition: >
      画面中有人做出明显的口部用力吐出的动作，并有液体/飞沫落到地面。
    evidence_required: 需要看到口部前伸用力的动作，最好同时可见落地飞沫。
    counter_examples:
      - 咳嗽、说话、喝水（无吐出物）
      - 弯腰动作
    observable_cues:
      - 头部前伸、口部张开用力
      - 地面出现小片湿痕

  - id: phone_while_driving
    name: 驾驶时使用手机
    enabled: false
    severity: high
    definition: >
      画面中有人坐在驾驶位（方向盘后方），同时手持手机并低头看向手机屏幕。
    evidence_required: 必须同时可见"方向盘/驾驶位"与"手持手机"。
    counter_examples:
      - 副驾驶位乘客使用手机
      - 手持其他物品（水杯、导航仪）
    observable_cues:
      - 方向盘或驾驶位在画面中可辨认
      - 一只手离开方向盘且握持矩形设备
