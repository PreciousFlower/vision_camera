# 不文明行为定义 —— 第一阶段的核心可配置项
#
# 设计原则（很重要，直接决定识别率）：
#   1. 只写「可视觉验证的感知线索」，不写「社会规范判断」。
#      反例：让模型判断"是否插队" → 模型要猜社会规则，必错。
#      正例：让模型找"有人从队列侧方切入到前方位置" → 纯视觉，可判。
#   2. 必须给反例（counter_examples）。VLM 最大的错法是"看到相似物体就报"，
#      反例是压制误报最有效的手段，比多加几条正例管用。
#   3. evidence_required 是防幻觉的关键：要求模型先描述"看到了什么"，
#      再下结论。先描述后判断，准确率显著高于直接问"有没有违规"。
#
# 改完这个文件不需要改任何代码，直接重跑即可。

version: 1
updated: "2026-10-05"

# 全局默认设置
defaults:
  # 一个判断窗口包含几帧（帧越多时序信息越强，但 token 成本线性上升）
  frames_per_window: 4
  # 窗口采样间隔（秒）；窗口之间不重叠
  window_stride_sec: 4.0
  # 连续多少个窗口命中才升级为「告警」（时序平滑，压制单帧误报）
  alert_after_consecutive_windows: 2
  # 模型温度：判分/检测类任务必须贪心解码，否则同一帧两次结果不同，无法复现
  temperature: 0.0
  # 输出上限（**上限，不是目标**；模型把 JSON 写完就停）。
  # ⚠️ 从 512 下调到 260 的原因：实测解码 35.8 token/s ≈ 每 token 28 毫秒，
  #    而压缩后的输出（紧凑 people + 未命中不写 observable）通常只要 150~250 token。
  #    留一个大上限只会让**跑飞的长尾**代价更高，并不影响正常速度。
  #    真正防截断的下限由 webui/server.py 按开关动态算（见那里的注释）。
  max_new_tokens: 260

behaviors:

  - id: littering
    name: 乱扔垃圾
    enabled: true
    severity: medium
    definition: >
      画面中有人把手中的物品（纸屑、瓶子、包装袋、烟头等）主动丢弃到地面、
      座椅或其他非垃圾容器的位置，并且丢弃后离开、不再拾取。
    evidence_required: >
      必须能看出"手中有物 → 物品脱手 → 物品落到地面/非容器处"这一动作链条。
      仅看到地上有垃圾、或仅看到人手里拿着东西，都不算。
    counter_examples:
      - 把物品放入垃圾桶或垃圾袋（这是正确行为）
      - 弯腰捡起地上的物品
      - 手中物品只是被身体遮挡，并未脱手
      - 画面中只有垃圾、没有可辨认的人
    observable_cues:
      - 手部由持物状态变为空手
      - 物体轨迹指向地面或非容器表面
      - 人物丢弃后有离开该位置的位移

  - id: smoking
    name: 吸烟
    enabled: true
    severity: high
    definition: >
      画面中有人正在吸烟：手部把香烟/电子烟送到嘴边并有吸食动作，
      或指间夹持点燃的香烟且口鼻部有烟雾呼出。
    evidence_required: >
      需要至少一项强证据：香烟本体被手指夹持并靠近口部、或口鼻处有明确的
      缕状烟雾。仅有"手靠近脸"或"画面中有白色雾气"不足以判定。
    counter_examples:
      - 喝饮料、用吸管、吃东西（手也靠近口部）
      - 手持笔、筷子、细长工具等外形相似的物体
      - 环境中的水汽、蒸汽、哈气（非从口鼻呼出）
      - 画面角落的烟雾来源无法与人物口鼻关联
    observable_cues:
      - 指间夹持细长白色物体且端部有亮点
      - 口鼻部有向外扩散的缕状烟
      - 吸食动作（抬手至口部后停顿）

  - id: queue_jumping
    name: 插队
    enabled: true
    severity: medium
    definition: >
      画面中存在一条由多人组成的有序队列（多人沿近似一条线前后排列），
      其中有人从队列的侧方切入到某两个人的中间位置，破坏了原有的前后次序。
    evidence_required: >
      必须同时看到三件事：① 存在可辨认的队列；② 有人从侧方接近；
      ③ 切入后队列的前后次序发生改变。缺少任一项都不判定。
    counter_examples:
      - 单人站立、两人并排（未构成队列）
      - 人从队列旁边走过，未插入
      - 队伍本来就松散、正在自由移动（如散场人流）
      - 有人离开队列（离队不算插队）
    observable_cues:
      - 队列成员沿一条线前后排列且朝向一致
      - 新个体从队列侧向位置移动到两个已有成员之间
      - 插入后原成员位置被推移或停顿

# ── 下面是"未启用"的扩展示例，展示如何只加配置、不加代码 ──
# 想启用就把 enabled 改成 true。id 必须唯一，全程用作告警类型标识。
  - id: spitting
    name: 随地吐痰
    enabled: false
    severity: high
    definition: >
      画面中有人做出明显的口部用力吐出的动作，并有液体/飞沫落到地面。
    evidence_required: 需要看到口部前伸用力的动作，最好同时可见落地飞沫。
    counter_examples:
      - 咳嗽、说话、喝水（无吐出物）
      - 弯腰动作
    observable_cues:
      - 头部前伸、口部张开用力
      - 地面出现小片湿痕

  - id: phone_while_driving
    name: 驾驶时使用手机
    enabled: false
    severity: high
    definition: >
      画面中有人坐在驾驶位（方向盘后方），同时手持手机并低头看向手机屏幕。
    evidence_required: 必须同时可见"方向盘/驾驶位"与"手持手机"。
    counter_examples:
      - 副驾驶位乘客使用手机
      - 手持其他物品（水杯、导航仪）
    observable_cues:
      - 方向盘或驾驶位在画面中可辨认
      - 一只手离开方向盘且握持矩形设备
